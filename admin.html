<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 10% 0,#e7eaff 0 10%,transparent 30%),#f8f7f4;color:#292d42;font-family:Inter,"Segoe UI",Arial,sans-serif}.card{width:min(100%,440px);padding:34px;background:#fff;border:1px solid #dde1ec;border-radius:22px;box-shadow:0 20px 52px #37419b18}.tag{color:#5668db;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:9px 0 10px;font-size:30px;letter-spacing:-.03em}p{margin:0 0 22px;color:#6f7488;line-height:1.55}label{display:block;margin-bottom:7px;font-size:13px;font-weight:600}input{width:100%;padding:12px 13px;border:1.5px solid #dde1ec;border-radius:11px;color:#292d42;font:inherit}input:focus{outline:4px solid #5668db18;border-color:#7d89df}button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:11px;background:#5668db;color:#fff;font:600 15px Inter,"Segoe UI",sans-serif;cursor:pointer}button:hover{background:#4353bd}.error{min-height:20px;margin:10px 0 0;color:#9b4e53;font-size:13px}.back{display:block;margin-top:18px;text-align:center;color:#59627e;font-size:13px}
</style>
</head>
<body>
<main class="card"><div class="tag">Private host area</div><h1>Host sign-in</h1><p>Enter the host PIN to open the dashboard and generate a room code.</p><form id="loginForm"><label for="pin">Host PIN</label><input id="pin" type="password" autocomplete="current-password" autofocus required><button type="submit">Open host dashboard</button><div class="error" id="error"></div></form><a class="back" href="/live.html">Join a quiz instead</a></main>
<script>
const requested=new URLSearchParams(location.search).get('next')||'/ai-quiz.html';
const next=/^\/(ai-quiz\.html|live\.html\?role=host)/.test(requested)?requested:'/ai-quiz.html';
fetch('/api/admin/status').then(r=>r.json()).then(s=>{if(s.authenticated)location.replace(next)}).catch(()=>{});
document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const error=document.getElementById('error');error.textContent='';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not sign in.');location.replace(next)}catch(e){error.textContent=e.message}});
</script>
</body>
</html>

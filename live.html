<body>
<header><div><div class="tag">AI · QA · networking · brain break</div><div class="brand">Team Quiz · Live ✨</div></div><a class="muted" href="/ai-quiz.html">Question editor</a></header>
<main class="wrap"><section id="screen" class="panel"><p class="muted">Connecting to the quiz…</p></section></main>
<script>
const params=new URLSearchParams(location.search),role=params.get('role'),roomId=params.get('room'),preferredRound=params.get('round'),voterId=localStorage.getItem('teamQuizVoter')||`voter-${Date.now()}-${Math.random().toString(36).slice(2)}`;localStorage.setItem('teamQuizVoter',voterId);
const screen=document.getElementById('screen'),hostTokenKey=id=>`teamQuizHostToken:${id}`;
let room=null,hostToken='',qs=[],selectedAnswer=null,lastState=null,tickTimer=null,stateTimer=null,clockOffset=0,lastDrawKey='',shareUrls=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function normalized(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function startPolling(){pollState();if(stateTimer)clearInterval(stateTimer);stateTimer=setInterval(pollState,650);if(tickTimer)clearInterval(tickTimer);tickTimer=setInterval(updateCountdown,200)}
function begin(){if(role==='host'){if(roomId){room=roomId;hostToken=localStorage.getItem(hostTokenKey(room))||sessionStorage.getItem(hostTokenKey(room))||'';renderHost();startPolling();return}renderHostSetup();return}if(roomId){room=roomId.toUpperCase();renderParticipant();startPolling();return}renderJoinScreen()}
function hostEntryUrl(){const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname),privateNetwork=/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);if(!local&&privateNetwork)return `http://localhost:${location.port||'8787'}/ai-quiz.html?host=1`;return `${location.origin}/ai-quiz.html?host=1`}
function renderJoinScreen(){screen.innerHTML=`<div class="tag">Team brain break</div><h1>Ready to play? 🎉</h1><p class="muted">Create a room for your team or jump in with the code on the host screen.</p><div class="rolegrid"><section class="rolecard"><div class="hostbadge">🎙️ Host controls</div><h2>I’m hosting</h2><p>Choose a starting round, invite everyone in, and run the show.</p><a href="${esc(hostEntryUrl())}" style="display:block;padding:11px 16px;background:linear-gradient(135deg,#8374ec,#7060d8);color:white;border-radius:13px">Create a quiz room →</a></section><section class="rolecard"><div class="hostbadge">🙌 Participant</div><h2>I’m joining</h2><p>Pop in the six-character room code and get ready to vote.</p><form style="width:100%" onsubmit="event.preventDefault();joinRoom()"><input id="roomCode" class="field" maxlength="12" autocomplete="off" placeholder="ROOM CODE"><button style="width:100%;margin-top:10px" type="submit">Let me in →</button></form><p id="joinError" class="error"></p></section></div>`}
function joinRoom(){const code=String(document.getElementById('roomCode')?.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code){document.getElementById('joinError').textContent='Enter the room code.';return}location.href=`live.html?room=${encodeURIComponent(code)}`}
function renderHostSetup(){qs=JSON.parse(localStorage.getItem('aiQaQuiz45')||'[]');let rounds=[...new Set(qs.map(q=>q.round))];screen.innerHTML=`<div class="tag">Host admin</div><h1>Generate a live room</h1><p class="muted">You are in the private host area. Choose where the quiz should begin, then generate the room code your team will use.</p><div class="stepnote"><b>1</b><span>Choose the starting round.</span><b>2</b><span>Generate the room code.</span><b>3</b><span>Share the code or participant link, then open voting.</span></div>${rounds.length?`<label class="muted" for="roundChoice">Starting round</label><div class="row" style="margin-top:7px"><select class="field grow" id="roundChoice">${rounds.map((r,i)=>`<option value="${esc(r)}" ${r===preferredRound?'selected':''}>${esc(r)} · ${qs.filter(q=>q.round===r).length} questions</option>`).join('')}</select><button onclick="createRoom()">Generate room code</button></div>`:'<p class="warning">No saved quiz is available in this browser. Return to the question editor, then choose “Host a live team quiz.”</p><p><a href="/ai-quiz.html#home">Open question editor</a></p>'}<p id="hostError" class="error"></p>`}
async function createRoom(){try{qs=JSON.parse(localStorage.getItem('aiQaQuiz45')||'[]');const round=document.getElementById('roundChoice').value;const result=await api('/api/room/create',{questions:qs,round});room=result.roomId;hostToken=result.hostToken;shareUrls=result.joinUrls||[];localStorage.setItem(hostTokenKey(room),hostToken);history.replaceState({},'',`live.html?role=host&room=${room}`);renderHost(shareUrls);startPolling()}catch(e){document.getElementById('hostError').textContent=e.message}}
function renderHost(urls=[]){shareUrls=urls;screen.innerHTML=`<div class="tag">Host admin · keep this screen open</div><div class="center"><div class="muted">Your live room code</div><div class="roomcode">${esc(room)}</div><p class="muted">Participants enter this code at the quiz homepage.</p></div><h1 id="hostHeading">Live quiz</h1><div class="joinbox"><b>Participant link</b><p><a id="joinLink"></a></p><button class="secondary" onclick="copyLink()">Copy participant link</button><details id="alternateLinks" class="hidden"><summary class="muted">Other available links</summary><ul class="linklist" id="linkList"></ul></details><p class="foot">Do not share this host page. Share only the room code or participant link above.</p></div><div id="hostState"></div><p id="hostError" class="error"></p>`;if(shareUrls.length)setShareLinks(shareUrls);else api(`/api/info?room=${encodeURIComponent(room)}`).then(info=>setShareLinks(info.joinUrls||[])).catch(()=>{})}
function setShareLinks(urls){shareUrls=[...new Set(urls)].filter(Boolean);const link=shareUrls[0]||`${location.origin}/live.html?room=${encodeURIComponent(room)}`,a=document.getElementById('joinLink');if(!a)return;a.href=link;a.textContent=link;const details=document.getElementById('alternateLinks'),list=document.getElementById('linkList');if(shareUrls.length>1){details.classList.remove('hidden');list.innerHTML=shareUrls.slice(1).map(url=>`<li><a href="${esc(url)}">${esc(url)}</a></li>`).join('')}}
function renderParticipant(){screen.innerHTML=`<div class="tag">Participant · room ${esc(room)}</div><div id="participantState"></div><p id="participantError" class="error"></p>`}
async function copyLink(){try{await navigator.clipboard.writeText(document.getElementById('joinLink').href);document.querySelector('.joinbox button').textContent='Copied ✓'}catch{document.getElementById('hostError').textContent='Copy the link from the address bar.'}}
async function pollState(){try{lastState=await api(`/api/room/state?id=${encodeURIComponent(room)}&voter=${encodeURIComponent(voterId)}`);clockOffset=Date.now()-(lastState.serverTime||Date.now());const drawKey=[lastState.version,lastState.stage,lastState.totalVotes,lastState.myVote,lastState.roundIndex,lastState.questionNumber].join(':');if(drawKey!==lastDrawKey){lastDrawKey=drawKey;if(role==='host')drawHost(lastState);else drawParticipant(lastState)}}catch(e){let el=document.getElementById(role==='host'?'hostError':'participantError');if(el)el.textContent=e.message}}
function countdown(){return lastState?.endsAt?Math.max(0,Math.ceil((lastState.endsAt-(Date.now()-clockOffset))/1000)):0}
function updateCountdown(){const n=countdown(),el=document.getElementById('countdown');if(el){el.textContent=`00:${String(n).padStart(2,'0')}`;el.classList.toggle('urgent',n<=5)}}
function drawHost(s){
 const el=document.getElementById('hostState');if(!el)return;
 const roomCodeBlock=screen.querySelector(':scope > .center'),shareBox=screen.querySelector(':scope > .joinbox'),hostHeading=document.getElementById('hostHeading');
 if(s.stage==='lobby'){
  roomCodeBlock?.classList.remove('hidden');shareBox?.classList.remove('hidden');hostHeading?.classList.remove('hidden');hostHeading.textContent='Waiting room';
  el.innerHTML=`<div class="center"><h2>Room ready! 🎈</h2><p class="muted">Share the code, let everyone settle in, then start whenever the team is ready.</p><button onclick="startQuiz()">Start the fun →</button></div>`;return
 }
 roomCodeBlock?.classList.add('hidden');shareBox?.classList.add('hidden');hostHeading?.classList.add('hidden');
 const canPrevious=s.stage==='round-complete'||s.stage==='quiz-complete'?s.roundCount>0:s.questionNumber>1;
 const previous=canPrevious?'<button class="secondary" onclick="previousQuestion()">← Previous question</button>':'';
 if(s.stage==='round-complete'){
  el.innerHTML=`<div class="center"><h2>Round complete!</h2><p class="muted">That was the end of this round. Let's move to the next round.</p><div class="row" style="justify-content:center;margin-top:18px">${previous}<button onclick="nextRound()">Start next round →</button></div></div>`;return
 }
 if(s.stage==='quiz-complete'){
  el.innerHTML=`<div class="center"><h2>Quiz complete!</h2><p class="muted">That was the final round. Thanks for taking part.</p><div class="row" style="justify-content:center;margin-top:18px">${previous}<a href="/ai-quiz.html">Return to the quiz editor</a></div></div>`;return
 }
 const q=s.question,stage=s.stage;
 if(stage==='waiting'){
  el.innerHTML=`<div class="qmeta"><span>${esc(s.round)}</span><span>Question ${s.questionNumber} of ${s.roundCount}</span></div><h2>${esc(q.q)}</h2>${questionChoices(q)}<div class="row" style="margin-top:18px">${previous}<button onclick="nextQuestion()">Finish discussion →</button></div>`;return
 }
 if(stage==='voting'){
  const voted=s.myVote!==null&&s.myVote!==undefined,voteArea=q.kind==='guess'?(voted?'<div class="submitted">Answer submitted and locked</div>':`<div class="row"><input id="guessAnswer" class="field grow" placeholder="Type your answer"><button onclick="sendVote(document.getElementById('guessAnswer').value)">Submit answer</button></div>`):participantChoices(s);
  el.innerHTML=`<div class="qmeta"><span>${esc(s.round)}</span><span>Question ${s.questionNumber} of ${s.roundCount} · ${s.totalVotes} votes in</span></div><h2>${esc(q.q)}</h2><div class="timer" id="countdown"></div>${voteArea}${voted&&q.kind!=='guess'?'<div class="submitted">Answer submitted and locked</div>':''}<div class="row" style="justify-content:flex-end;margin-top:20px"><button class="secondary" onclick="closeVote()">End voting now</button></div>`;updateCountdown();return
 }
 const forward=s.questionNumber<s.roundCount?'<button onclick="nextQuestion()">Next question →</button>':s.roundIndex<s.roundsCount-1?'<button onclick="nextQuestion()">Complete round →</button>':'<button onclick="nextQuestion()">Finish quiz</button>';
 el.innerHTML=`<div class="qmeta"><span>${esc(s.round)}</span><span>Question ${s.questionNumber} of ${s.roundCount} · ${s.totalVotes} responses</span></div><h2>${esc(q.q)}</h2>${participantResult(s)}<div class="row" style="justify-content:space-between;margin-top:22px">${previous}${forward}</div>`
}
function questionChoices(q){return q.kind==='guess'?'<p class="muted">Participants will submit a short text answer.</p>':q.kind==='debate'?'<p class="muted">Open discussion question · no automatic score.</p>':`<div class="answers">${(q.o||[]).map((o,i)=>`<div class="answer"><span class="letter">${'ABCD'[i]||i+1}</span>${esc(o)}</div>`).join('')}</div>`}
function drawResults(s){const q=s.question;if(q.kind==='debate')return '<div class="pollinfo">Open discussion · no answers were scored.</div>';if(q.kind==='poll')return `<div class="pollinfo">Team poll · ${s.totalVotes} vote${s.totalVotes===1?'':'s'}</div>${(q.o||[]).map((o,i)=>resultBar(o,s.counts[i]||0,s.totalVotes)).join('')}<p class="muted">No right answer on this poll.</p>`;if(q.kind==='guess')return `<div class="correct">${s.correctCount} of ${s.totalVotes} got it right · ${s.correctPercent}% correct · Answer: ${esc(s.answer)}</div>${q.note?`<p class="muted">${esc(q.note)}</p>`:''}`;return `${(q.o||[]).map((o,i)=>resultBar(o,s.counts[i]||0,s.totalVotes,i===Number(s.answerIndex))).join('')}<div class="correct">${s.correctCount} of ${s.totalVotes} got it right · ${s.correctPercent}% correct · Correct answer: ${esc(s.answer)}</div>`}
function resultBar(label,count,total,isCorrect=false){let pct=total?Math.round(count/total*100):0;return `<div class="barrow ${isCorrect?'correct-answer':''}"><div class="barlabel"><span>${esc(label)}</span><span>${count} vote${count===1?'':'s'} · ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}
function participantChoices(s,results=false){const q=s.question;if(!q||!['mcq','poll'].includes(q.kind))return '';const voted=s.myVote!==null&&s.myVote!==undefined;return `<div class="answers">${(q.o||[]).map((o,i)=>{let state='';if(results){if(q.kind==='mcq'&&i===Number(s.answerIndex))state='correct-choice';else if(q.kind==='mcq'&&voted&&i===Number(s.myVote))state='wrong-choice';else if(q.kind==='poll'&&voted&&i===Number(s.myVote))state='chosen'}else if(voted&&i===Number(s.myVote))state='chosen';const locked=results||voted;return `<button class="answer ${state} ${locked?'locked':''}" ${locked?'disabled':''} onclick="selectedAnswer=${i};sendVote(${i})"><span class="letter">${'ABCD'[i]||i+1}</span>${esc(o)}</button>`}).join('')}</div>`}
function participantBars(s){const q=s.question;if(!q||!['mcq','poll'].includes(q.kind))return '';const choices=q.o||[],bars=choices.map((o,i)=>{const count=s.counts[i]||0,pct=s.totalVotes?Math.round(count/s.totalVotes*100):0;return `<div class="vote-column" style="--pct:${pct}" title="${esc(o)}: ${pct}%"><span class="vote-value">${pct}%</span><i class="vote-stick"></i><b class="vote-letter">${'ABCD'[i]||i+1}</b></div>`}).join(''),legend=choices.map((o,i)=>`<span><b>${'ABCD'[i]||i+1}</b>${esc(o)}</span>`).join('');return `<section class="results-chart"><h3>How the team voted · ${s.totalVotes} response${s.totalVotes===1?'':'s'}</h3><div class="vote-chart"><div class="vote-columns" style="--choices:${choices.length}">${bars}</div></div><div class="chart-legend">${legend}</div></section>`}
function participantResult(s){const q=s.question;if(q.kind==='mcq'||q.kind==='poll')return `${participantChoices(s,true)}${participantBars(s)}`;if(q.kind==='guess')return `<div class="correct">${s.correctCount} of ${s.totalVotes} matched the answer · ${s.correctPercent}%</div>${q.note?`<p class="muted">${esc(q.note)}</p>`:''}`;return '<div class="pollinfo">Open discussion · no answers were scored.</div>'}
function drawParticipant(s){const el=document.getElementById('participantState');if(!el)return;if(s.stage==='lobby'){el.innerHTML=`<div class="center"><h1>You're in</h1><p class="muted">Waiting for the host to start the quiz.</p></div>`;return}if(s.stage==='round-complete'){el.innerHTML=`<div class="center"><h1>Round complete!</h1><p class="muted">Let's move to the next round. The host will start it shortly.</p></div>`;return}if(s.stage==='quiz-complete'){el.innerHTML='<div class="center"><h1>Quiz complete!</h1><p class="muted">Thanks for taking part.</p></div>';return}const q=s.question;if(s.stage==='waiting'){el.innerHTML=`<div class="qmeta"><span>${esc(s.round)}</span><span>Question ${s.questionNumber} of ${s.roundCount}</span></div><h2>${esc(q.q)}</h2><p class="muted">Get ready. The host will open voting shortly.</p>`;return}if(s.stage==='results'){el.innerHTML=`<div class="qmeta"><span>${esc(s.round)}</span><span>Results · ${s.totalVotes} responses</span></div><h2>${esc(q.q)}</h2>${participantResult(s)}<p class="muted">Waiting for the host to continue.</p>`;return}let voting=q.kind!=='debate',voted=s.myVote!==null&&s.myVote!==undefined;el.innerHTML=`<div class="qmeta"><span>${esc(s.round)}</span><span>Question ${s.questionNumber} of ${s.roundCount}</span></div><h2>${esc(q.q)}</h2><div class="timer" id="countdown"></div>${q.kind==='poll'?'<div class="pollinfo">Team poll: choose one option. The response breakdown appears when voting closes.</div>':q.kind==='guess'?'<div class="pollinfo">Submit one answer before the timer ends.</div>':'<div class="pollinfo">Choose one answer before the timer ends.</div>'}${voting?q.kind==='guess'?(voted?'<div class="submitted">Answer submitted and locked</div>':`<div class="row"><input id="guessAnswer" class="field grow" placeholder="Type your answer"><button onclick="sendVote(document.getElementById('guessAnswer').value)">Submit answer</button></div>`):`${participantChoices(s)}${voted?'<div class="submitted">Answer submitted and locked</div>':''}`:`<div class="warning">Open discussion. Listen to the host, then wait for the next question.</div>`}`;updateCountdown()}
async function sendVote(answer){if(lastState?.myVote!==null&&lastState?.myVote!==undefined)return;selectedAnswer=answer;const optimistic=lastState?{...lastState,myVote:answer}:null;if(optimistic)(role==='host'?drawHost:drawParticipant)(optimistic);try{await api('/api/room/vote',{id:room,voter:voterId,answer});selectedAnswer=null;lastDrawKey='';await pollState()}catch(e){selectedAnswer=null;if(lastState)(role==='host'?drawHost:drawParticipant)(lastState);let el=document.getElementById(role==='host'?'hostError':'participantError');if(el)el.textContent=e.message}}
async function hostAction(path,body={}){try{if(!hostToken)throw Error('This browser does not have the host control key. Create a new live room from this browser.');await api(path,{id:room,hostToken,...body});lastDrawKey='';await pollState()}catch(e){let el=document.getElementById('hostError');if(el)el.textContent=e.message}}
function startQuiz(){hostAction('/api/room/start')}function startVote(){hostAction('/api/room/start-vote',{duration:Number(document.getElementById('duration').value)})}function closeVote(){hostAction('/api/room/close-vote')}function previousQuestion(){hostAction('/api/room/previous')}function nextQuestion(){hostAction('/api/room/next')}function nextRound(){hostAction('/api/room/next-round')}
function splitArgs(text){let args=[],current='',quote='',escape=false;for(const ch of text){if(escape){current+=ch;escape=false;continue}if(ch==='\\'){current+=ch;escape=true;continue}if(quote){current+=ch;if(ch===quote)quote='';continue}if(ch==="'"||ch==='"'){quote=ch;current+=ch;continue}if(ch===','){args.push(current.trim());current='';continue}current+=ch}if(current.trim())args.push(current.trim());return args}
function readArg(raw){if(raw===''||raw===undefined)return undefined;if(/^[-]?\d+(\.\d+)?$/.test(raw))return Number(raw);if(raw[0]==="'"&&raw.at(-1)==="'")return raw.slice(1,-1).replace(/\\'/g,"'");if(raw[0]==='"'&&raw.at(-1)==='"'){try{return JSON.parse(raw)}catch{return raw.slice(1,-1)}}return raw}
function dispatchInlineFallback(action,event){action=String(action||'').trim();if(!action)return false;if(action==='event.preventDefault();joinRoom()'){joinRoom();return true}if(action==="sendVote(document.getElementById('guessAnswer').value)"){sendVote(document.getElementById('guessAnswer').value);return true}let selected=action.match(/^selectedAnswer=(\d+);sendVote\((\d+)\)$/);if(selected){selectedAnswer=Number(selected[1]);sendVote(Number(selected[2]));return true}let m=action.match(/^([A-Za-z]\w*)\((.*)\)$/);if(!m)return false;const fn=window[m[1]];if(typeof fn!=='function')return false;fn(...splitArgs(m[2]).map(readArg));return true}
function bindInlineFallbacks(){document.addEventListener('click',event=>{const source=event.target.closest?.('[onclick]')||event.target;if(!source?.getAttribute)return;const action=source.getAttribute('onclick');if(dispatchInlineFallback(action,event)){event.preventDefault();event.stopImmediatePropagation()}},true)}
Object.assign(window,{createRoom,copyLink,joinRoom,pollState,startQuiz,startVote,closeVote,previousQuestion,nextQuestion,nextRound,sendVote,hostAction});
bindInlineFallbacks();
begin();
</script>
